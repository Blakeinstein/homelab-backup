{{define "style"}}
<style>
    :root { color-scheme: dark; }
    body { font-family: ui-sans-serif, system-ui, sans-serif; background:#0f1115; color:#e6e6e6; margin:0; padding:2rem; }
    h1 { font-size:1.4rem; margin:0 0 .4rem; }
    h2 { font-size:1.05rem; margin:2rem 0 .6rem; }
    .sub { color:#8a93a5; font-size:.85rem; margin-bottom:1rem; }
    .nav { display:flex; gap:.4rem; margin-bottom:1.5rem; font-size:.88rem; }
    .logo { width:22px; height:22px; object-fit:contain; vertical-align:middle; }
    .logo.fallback { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:6px; background:#242830; color:#8a93a5; font-size:.7rem; font-weight:700; }
    .nav a { color:#8a93a5; text-decoration:none; padding:.3rem .7rem; border-radius:6px; }
    .nav a:hover { color:#e6e6e6; background:#1a1d24; }
    .nav a.on { color:#fff; background:#23262e; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align:left; padding:.55rem .75rem; border-bottom:1px solid #23262e; font-size:.9rem; vertical-align:top; }
    th { color:#8a93a5; font-weight:600; text-transform:uppercase; font-size:.7rem; letter-spacing:.06em; }
    .pill { display:inline-block; padding:.15rem .6rem; border-radius:999px; font-size:.75rem; font-weight:600; }
    .success { background:#143d2a; color:#5ee7a0; }
    .error { background:#4a1f22; color:#ff8f8f; }
    .never { background:#2a2a2a; color:#a0a0a0; }
    .running { background:#123c4a; color:#7fd7ff; }
    button, .btn { background:#2563eb; color:#fff; border:0; padding:.35rem .8rem; border-radius:6px; cursor:pointer; font-size:.8rem; display:inline-block; text-decoration:none; }
    button:disabled { opacity:.5; cursor:wait; }
    button:hover { background:#1d4ed8; }
    .btn.small { background:#2a2f3a; color:#c9d1dc; padding:.25rem .6rem; font-size:.75rem; }
    .btn.small:hover { background:#333a47; }
    .btn.danger { background:#3a2024; color:#ff9a9a; }
    .btn.danger:hover { background:#4a262c; }
    .muted { color:#8a93a5; font-size:.78rem; }
    .msg { max-width:28rem; white-space:pre-wrap; font-size:.72rem; color:#c08080; }
    .flash { border:1px solid #2e6c4c; background:#12301f; color:#9fe8c0; padding:.6rem .9rem; border-radius:8px; margin-bottom:1.2rem; font-size:.85rem; white-space:pre-wrap; }
    .err-banner { border:1px solid #7a2c33; background:#33161a; color:#ff8f8f; padding:.6rem .9rem; border-radius:8px; margin-bottom:1.2rem; font-size:.85rem; white-space:pre-wrap; }
    form { margin:0; }
    .field { margin-bottom:.9rem; max-width:38rem; }
    .field label { display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:#8a93a5; margin-bottom:.25rem; }
    .field input[type=text], .field input[type=number], .field textarea,
    .field select { width:100%; box-sizing:border-box; background:#171a20; color:#e6e6e6; border:1px solid #2a2e38; border-radius:6px; padding:.45rem .6rem; font-size:.85rem; font-family:inherit; }
    .field textarea { min-height:4.5rem; font-family:ui-monospace, SFMono-Regular, monospace; }
    .field .hint { color:#8a93a5; font-size:.72rem; margin-top:.25rem; }
    .grid { display:flex; gap:1.25rem; flex-wrap:wrap; }
    .grid .field { flex:1 1 15rem; }
    .checks { display:flex; gap:1.4rem; align-items:center; margin:.7rem 0; font-size:.85rem; }
    details { border:1px solid #23262e; border-radius:10px; padding:.7rem 1rem; margin-bottom:1rem; background:#12151a; }
    details > summary { cursor:pointer; font-weight:600; }
    code { font-size:.82rem; }
    .actions { display:flex; gap:.45rem; align-items:center; flex-wrap:wrap; }
</style>
{{end}}

{{define "nav"}}
<div class="nav">
  <a href="/" {{if eq .Current "/"}}class="on"{{end}}>Status</a>
  <a href="/settings/backups" {{if eq .Current "/settings/backups"}}class="on"{{end}}>Backups config</a>
  <a href="/settings" {{if eq .Current "/settings"}}class="on"{{end}}>Settings</a>
</div>
{{end}}
